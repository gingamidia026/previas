# Publica o visualizador (site/) mais as prévias cifradas (p/) no GitHub Pages.
# Roda em todo push no main, à mão e de hora em hora. Antes de publicar, apaga as prévias vencidas (ou sem expira.json válido)
# e guarda a limpeza num commit, para a pasta p/ do repositório também ficar limpa.
name: Publicar prévias

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# Uma publicação por vez; a mais nova espera a que está rodando terminar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Apagar prévias vencidas
        run: node ferramentas/limpar-vencidas.mjs p

      - name: Guardar a limpeza no repositório
        run: |
          git config user.name "Ginga Previas (Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A p
          if git diff --cached --quiet; then
            echo "Nada vencido para apagar."
          else
            git commit -m "Apaga prévias vencidas"
            # Se chegou um envio novo no meio da limpeza, ele dispara a própria publicação e limpa de novo
            git push || echo "Envio da limpeza recusado (chegou commit novo); a próxima publicação refaz."
          fi

      - name: Montar a pasta publicada (site/ mais p/)
        run: |
          mkdir _pages
          cp -r site/. _pages/
          if [ -d p ]; then cp -r p _pages/p; fi
          touch _pages/.nojekyll

      - name: Enviar o pacote do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages

  # Em etapa separada, como no modelo oficial: a implantação só acha o pacote depois que a etapa que o enviou termina
  implantar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    steps:
      - name: Implantar no Pages
        id: implantacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
